<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Never Again — cover</title>
<!-- Source for cover.png (1280x720 @2x). Built to read at gallery-thumbnail size:
     big title, the constellation, three large proof points, team credit. The dense version is poster.html. -->
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet" />
<style>
  :root { --bg: #08090a; --line: rgba(255,255,255,.14); --text: #ededef; --muted: #8a8a92;
    --red: #ff4d5e; --green: #2bd99f; --blue: #4589ff; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: var(--bg); color: var(--text);
    font: 400 16px/1.4 'Geist', sans-serif; font-variant-ligatures: none; -webkit-font-smoothing: antialiased; }
  .cover { position: relative; width: 1280px; height: 720px; overflow: hidden;
    background: var(--bg) url(img/sky.png) no-repeat -1700px -560px / 3200px 1800px; }
  .scene { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 85% 50%; mix-blend-mode: screen; }
  .glow { position: absolute; left: -60px; top: 150px; width: 720px; height: 380px;
    background: radial-gradient(closest-side, rgba(43,217,159,.14), transparent); }
  .copy { position: absolute; left: 72px; top: 0; bottom: 0; width: 660px; display: flex; flex-direction: column; justify-content: center; }
  .top { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
  .top img { width: 60px; height: 60px; filter: drop-shadow(0 0 16px rgba(43,217,159,.5)); }
  .pill { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line);
    background: rgba(20,22,26,.72); font: 600 15px 'Geist', sans-serif; color: #cfe0ff; }
  .pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 0 3px rgba(69,137,255,.2); }
  h1 { font-size: 150px; font-weight: 800; line-height: .98; letter-spacing: -0.06em; padding-bottom: 8px; margin-bottom: -6px;
    background: linear-gradient(180deg, #ffffff 40%, #b9f5df 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .tagline { margin-top: 16px; font-size: 27px; font-weight: 500; letter-spacing: -0.02em; color: #dcdce1; }
  .proof { display: flex; gap: 12px; margin-top: 30px; }
  .p { padding: 12px 18px; border-radius: 14px; border: 1px solid var(--line);
    background: linear-gradient(160deg, rgba(22,24,28,.9), rgba(12,13,15,.85)); box-shadow: inset 0 1px 0 rgba(255,255,255,.05); }
  .p b { display: block; font: 800 28px/1.05 'Geist', sans-serif; letter-spacing: -0.035em; white-space: nowrap; }
  .p span { font: 600 11px 'Geist Mono', monospace; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .p b em { font-style: normal; }
  .g { color: var(--green); } .r { color: var(--red); } .dim { color: var(--muted); font-weight: 600; }
  .team { position: absolute; left: 72px; bottom: 44px; display: inline-flex; flex-direction: column; gap: 1px; padding: 12px 18px;
    border-radius: 12px; border: 1px solid rgba(255,255,255,.75);
    background: linear-gradient(135deg, rgba(255,255,255,.97), rgba(242,252,248,.91));
    box-shadow: 0 10px 30px rgba(43,217,159,.28), inset 0 1px 0 #fff; }
  .team b { font: 700 18px 'Geist', sans-serif; color: #07090b; letter-spacing: -0.01em; }
  .team span { font: 500 14px 'Geist', sans-serif; color: #2a2c31; }
  .copy { padding-bottom: 120px; }
</style>
</head>
<body>
<div class="cover">
  <img class="scene" src="img/scene-after.png" alt="" />
  <div class="glow"></div>
  <div class="copy">
    <div class="top">
      <img src="../../dashboard/public/icon-512.png" alt="" />
      <span class="pill"><i></i>Built with IBM Bob 2.0</span>
    </div>
    <h1>Never<br />Again</h1>
    <p class="tagline">Postmortems → proven regression guards.</p>
    <div class="proof">
      <div class="p"><b class="g">3/3 guarded</b><span>incidents</span></div>
      <div class="p"><b><em class="r">7</em><em class="dim"> → </em><em class="g">0</em></b><span>hidden bugs</span></div>
      <div class="p"><b><em class="r">✗</em> bug <em class="dim">·</em> <em class="g">✓</em> fix</b><span>proven both ways</span></div>
    </div>
  </div>
  <div class="team"><b>Team Kira</b><span>Harsh Dhavane · TY Computer Engineering, VIT Pune</span></div>
</div>
</body>
</html>
